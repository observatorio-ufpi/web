name: Deploy Observatorio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Diagnóstico antes do build
        env:
          VITE_API_PUBLIC_URL: ${{ secrets.VITE_API_PUBLIC_URL }}
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ secrets.VITE_PLAUSIBLE_SRC }}
        run: |
          set -euo pipefail
          echo "===== 1/4 ambiente do runner ====="
          echo "runner: ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "pasta: $(pwd)"
          echo "CI=${CI:-}"
          echo "script de build: $(node -p "require('./package.json').scripts.build")"
          echo
          echo "===== 2/4 envs do Vite ====="
          echo "Valores públicos, gravados no bundle. Se o GitHub mostrar ***, o secret foi mascarado no log."
          mostrar() {
            local nome="$1"
            local valor="${2-}"
            if [ -z "$valor" ]; then
              echo "$nome: VAZIA"
            else
              echo "$nome: $valor"
              echo "  tamanho: ${#valor} caracteres"
            fi
          }
          mostrar VITE_API_PUBLIC_URL "${VITE_API_PUBLIC_URL:-}"
          mostrar VITE_PLAUSIBLE_DOMAIN "${VITE_PLAUSIBLE_DOMAIN:-}"
          mostrar VITE_PLAUSIBLE_SRC "${VITE_PLAUSIBLE_SRC:-}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "===== 3/4 npm install ====="
          npm install --loglevel verbose
          echo "===== npm install concluído ====="

      - name: Build project
        run: |
          set -euo pipefail
          echo "===== 4/4 npm run build ====="
          echo "VITE_API_PUBLIC_URL=${VITE_API_PUBLIC_URL:-}"
          echo "VITE_PLAUSIBLE_DOMAIN=${VITE_PLAUSIBLE_DOMAIN:-}"
          echo "VITE_PLAUSIBLE_SRC=${VITE_PLAUSIBLE_SRC:-}"
          npm run build --loglevel verbose
          echo "===== build concluído, conferindo a pasta build/ ====="
          if [ ! -f build/index.html ]; then
            echo "ERRO: build/index.html não foi gerado. Conteúdo da pasta atual:"
            ls -la
            exit 1
          fi
          du -sh build
          find build -maxdepth 2 -type f | sort
        env:
          VITE_API_PUBLIC_URL: ${{ secrets.VITE_API_PUBLIC_URL }}
          # Estatística de uso (Plausible). Sem estes secrets fica desligada.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ secrets.VITE_PLAUSIBLE_SRC }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Upload static files content only
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: src/files/*  # aqui subimos só o conteúdo, sem a pasta 'files'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup OpenFortiVPN
        env:
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_CERT_HASH: ${{ secrets.VPN_CERT_HASH }}
        run: |
          set -euo pipefail
          echo "===== VPN: valores usados ====="
          echo "gateway: vpnssl.ati.pi.gov.br:443"
          echo "Se o GitHub mostrar ***, o secret foi mascarado no log. O tamanho continua visível."
          mostrar() {
            local nome="$1"
            local valor="${2-}"
            if [ -z "$valor" ]; then
              echo "$nome: VAZIA"
            else
              echo "$nome: $valor"
              echo "  tamanho: ${#valor} caracteres"
            fi
          }
          mostrar VPN_USERNAME "${VPN_USERNAME:-}"
          mostrar VPN_CERT_HASH "${VPN_CERT_HASH:-}"
          if [ -z "${VPN_PASSWORD:-}" ]; then
            echo "VPN_PASSWORD: VAZIA"
          else
            echo "VPN_PASSWORD: definida (${#VPN_PASSWORD} caracteres)"
          fi

          sudo apt-get update
          sudo apt-get install -y openfortivpn
          echo "openfortivpn: $(openfortivpn --version 2>&1 | head -1 || true)"

          echo "===== VPN: subindo o túnel ====="
          # O sudo deste runner não entrega o pipe ao openfortivpn, que fica parado em
          # "VPN account password:". A senha vai no arquivo de config, modo 600, e não é impressa.
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("/tmp/openfortivpn.conf").write_text(
              "host = vpnssl.ati.pi.gov.br\n"
              "port = 443\n"
              f"username = {os.environ['VPN_USERNAME']}\n"
              f"password = {os.environ['VPN_PASSWORD']}\n"
              f"trusted-cert = {os.environ['VPN_CERT_HASH']}\n"
              "pppd-use-peerdns = 1\n"
          )
          PY
          sudo openfortivpn -c /tmp/openfortivpn.conf > /tmp/openfortivpn.log 2>&1 &

          tunel=0
          for i in $(seq 1 45); do
            if grep -q "Tunnel is up" /tmp/openfortivpn.log 2>/dev/null; then
              echo "túnel no ar após ${i}s"
              tunel=1
              break
            fi
            if ! pgrep -x openfortivpn >/dev/null && [ "$i" -gt 3 ]; then
              echo "openfortivpn encerrou aos ${i}s, antes do túnel"
              break
            fi
            sleep 1
          done

          echo "===== log do openfortivpn ====="
          cat /tmp/openfortivpn.log || true
          echo "===== interfaces ====="
          ip -br addr || true
          echo "===== rotas ====="
          ip route || true

          if [ "$tunel" -ne 1 ]; then
            echo "ERRO: o túnel não subiu. A cópia para o servidor nem começa."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-files
          path: files/

      - name: Conferir SSH antes da cópia
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "===== destino da cópia ====="
          echo "Se o GitHub mostrar ***, o secret foi mascarado no log. O tamanho continua visível."
          mostrar() {
            local nome="$1"
            local valor="${2-}"
            if [ -z "$valor" ]; then
              echo "$nome: VAZIA"
            else
              echo "$nome: $valor"
              echo "  tamanho: ${#valor} caracteres"
            fi
          }
          mostrar SERVER_HOST "${SERVER_HOST:-}"
          mostrar SERVER_USER "${SERVER_USER:-}"
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY: VAZIA"
          else
            echo "SSH_PRIVATE_KEY: definida (${#SSH_PRIVATE_KEY} caracteres)"
          fi
          echo "origem: build/*"
          echo "destino: /tmp/observatorio-build"
          echo "arquivos em build/:"
          find build -maxdepth 2 -type f | sort

          echo "===== rota até o servidor ====="
          ip route get "$SERVER_HOST" || true
          if ip route get "$SERVER_HOST" | grep -q 'dev ppp'; then
            echo "rota sai pela interface da VPN"
          else
            echo "AVISO: a rota não sai por ppp. O pacote não entra no túnel."
          fi

          echo "===== teste TCP na porta 22, a partir do runner ====="
          if timeout 10 bash -c "echo >/dev/tcp/${SERVER_HOST}/22"; then
            echo "porta 22 respondeu"
          else
            echo "ERRO: porta 22 não respondeu em 10s. É o mesmo i/o timeout do scp."
            echo "===== log do openfortivpn agora ====="
            cat /tmp/openfortivpn.log || true
            exit 1
          fi

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"
          target: "/tmp/observatorio-build"
          debug: true

      - name: Copy static files content to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "files/*"  # aqui teremos apenas os arquivos e subpastas, sem 'files' extra
          target: "/tmp/observatorio-files"

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # cria pasta de destino
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mkdir -p /var/www/html/observatorio/web/build/src/files
            
            # faz backup do build atual
            if [ -d /var/www/html/observatorio/web/build ]; then
              echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mv /var/www/html/observatorio/web/build /var/www/html/observatorio/web/build-backup-$(date +%Y%m%d-%H%M%S)
            fi

            # copia build
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S cp -r /tmp/observatorio-build/* /var/www/html/observatorio/web/build/

            # cria pasta de destino
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mkdir -p /var/www/html/observatorio/web/build/src/

            # copia arquivos estáticos (conteúdo direto)
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S cp -r /tmp/observatorio-files/. /var/www/html/observatorio/web/build/src/

            # corrige permissões
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chown -R www-data:www-data /var/www/html/observatorio/web

            # recarrega nginx
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl reload nginx

            # limpa temporários
            rm -rf /tmp/observatorio-build
            rm -rf /tmp/observatorio-files

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill openfortivpn || true

