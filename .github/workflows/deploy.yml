name: Deploy Observatorio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Diagnóstico antes do build
        env:
          VITE_API_PUBLIC_URL: ${{ secrets.VITE_API_PUBLIC_URL }}
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ secrets.VITE_PLAUSIBLE_SRC }}
        run: |
          set -euo pipefail
          echo "===== 1/4 ambiente do runner ====="
          echo "runner: ${RUNNER_OS:-?} ${RUNNER_ARCH:-?}"
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "pasta: $(pwd)"
          echo "CI=${CI:-}"
          echo "script de build: $(node -p "require('./package.json').scripts.build")"
          echo
          echo "===== 2/4 envs do Vite ====="
          echo "Valores públicos, gravados no bundle. Se o GitHub mostrar ***, o secret foi mascarado no log."
          mostrar() {
            local nome="$1"
            local valor="${2-}"
            if [ -z "$valor" ]; then
              echo "$nome: VAZIA"
            else
              echo "$nome: $valor"
              echo "  tamanho: ${#valor} caracteres"
            fi
          }
          mostrar VITE_API_PUBLIC_URL "${VITE_API_PUBLIC_URL:-}"
          mostrar VITE_PLAUSIBLE_DOMAIN "${VITE_PLAUSIBLE_DOMAIN:-}"
          mostrar VITE_PLAUSIBLE_SRC "${VITE_PLAUSIBLE_SRC:-}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "===== 3/4 npm install ====="
          npm install --loglevel verbose
          echo "===== npm install concluído ====="

      - name: Build project
        run: |
          set -euo pipefail
          echo "===== 4/4 npm run build ====="
          echo "VITE_API_PUBLIC_URL=${VITE_API_PUBLIC_URL:-}"
          echo "VITE_PLAUSIBLE_DOMAIN=${VITE_PLAUSIBLE_DOMAIN:-}"
          echo "VITE_PLAUSIBLE_SRC=${VITE_PLAUSIBLE_SRC:-}"
          npm run build --loglevel verbose
          echo "===== build concluído, conferindo a pasta build/ ====="
          if [ ! -f build/index.html ]; then
            echo "ERRO: build/index.html não foi gerado. Conteúdo da pasta atual:"
            ls -la
            exit 1
          fi
          du -sh build
          find build -maxdepth 2 -type f | sort
        env:
          VITE_API_PUBLIC_URL: ${{ secrets.VITE_API_PUBLIC_URL }}
          # Estatística de uso (Plausible). Sem estes secrets fica desligada.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_SRC: ${{ secrets.VITE_PLAUSIBLE_SRC }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Upload static files content only
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: src/files/*  # aqui subimos só o conteúdo, sem a pasta 'files'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup OpenFortiVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openfortivpn
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openfortivpn vpnssl.ati.pi.gov.br:443 -u ${{ secrets.VPN_USERNAME }} --trusted-cert ${{ secrets.VPN_CERT_HASH }} --pppd-use-peerdns=1 &
          sleep 15

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-files
          path: files/

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"
          target: "/tmp/observatorio-build"

      - name: Copy static files content to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "files/*"  # aqui teremos apenas os arquivos e subpastas, sem 'files' extra
          target: "/tmp/observatorio-files"

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # cria pasta de destino
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mkdir -p /var/www/html/observatorio/web/build/src/files
            
            # faz backup do build atual
            if [ -d /var/www/html/observatorio/web/build ]; then
              echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mv /var/www/html/observatorio/web/build /var/www/html/observatorio/web/build-backup-$(date +%Y%m%d-%H%M%S)
            fi

            # copia build
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S cp -r /tmp/observatorio-build/* /var/www/html/observatorio/web/build/

            # cria pasta de destino
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S mkdir -p /var/www/html/observatorio/web/build/src/

            # copia arquivos estáticos (conteúdo direto)
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S cp -r /tmp/observatorio-files/. /var/www/html/observatorio/web/build/src/

            # corrige permissões
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chown -R www-data:www-data /var/www/html/observatorio/web

            # recarrega nginx
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl reload nginx

            # limpa temporários
            rm -rf /tmp/observatorio-build
            rm -rf /tmp/observatorio-files

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill openfortivpn || true

